version = 1
portfolio_id = "engineering-portfolio"

[[projects]]
project_id = "NP01"
name = "Industrial Resilience OT Lab"
relative_path = "../industrial-resilience-ot-lab"
plain_language_description = "A synthetic two-tank industrial cell that detects abnormal signals, enters degraded or fault states, records recovery, and verifies replayable behavior."
domain = "OT / industrial resilience"
tested_commit = "c23fd11dedfe81ba8e1c529197e782abffcb4acd"
requires_docker = true
prerequisites = ["Python 3.12", "a project-local .venv", "Docker Desktop", "the local OpenPLC image and Mosquitto service described in the project README"]
evidence_location = "var/runs"
latest_valid_location = "var/latest_valid.json"
[projects.actions]
demo = ["scripts/demo.py"]
tests = ["-m", "pytest"]
operate = ["scripts/run_operational.py"]
replay = ["scripts/run_operational.py", "--replay"]
start_services = ["docker", "compose", "up", "-d"]
cleanup = ["docker", "compose", "down", "-v"]

