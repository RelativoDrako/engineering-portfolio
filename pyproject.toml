[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-portfolio-operator"
version = "0.1.0"
description = "Local operator and learning surface for four independent engineering portfolio projects"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "Jinja2>=3.1,<4"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
portfolio-operator = "portfolio_operator.cli:main"
portfolio-operator-web = "portfolio_operator.web:main"

[tool.setuptools.packages.find]
where = ["."]
